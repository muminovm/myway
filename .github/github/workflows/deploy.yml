name: Advanced Production Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: 1. Скачивание исходного кода
        uses: actions/checkout@v4

      - name: 2. Сборка и запуск через Docker Compose
        run: |
          docker compose down || true
          docker compose build
          docker compose up -d

      - name: 3. Health Check (Проверка работоспособности)
        run: |
          echo "Ожидание запуска приложения..."
          sleep 5
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Health check пройден успешно! (HTTP 200)"
          else
            echo "Health check провален! Код ответа: $HTTP_STATUS"
            exit 1
          fi

      - name: 4. Уведомление в Telegram при успехе
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="✅ *Деплой успешно завершен!*%0A• Проект: myway%0A• Коммит: ${{ github.sha }}" \
            -d parse_mode="Markdown"

      - name: 5. Откат и уведомление при ошибке
        if: failure()
        run: |
          echo "Сбой деплоя! Откатываемся на предыдущий рабочий образ..."
          docker compose down
          # Здесь запускается предыдущая стабильная версия
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="❌ *Ошибка деплоя!*%0AПриложение не прошло Health Check. Выполнен откат." \
            -d parse_mode="Markdown"
